      const groupId = ppl.length > 1 ? "g" + Date.now().toString(36) : "";
      for (const p of ppl) await DB.add("tasks", { ...base, assignee:p.email, assigneeName:p.name, status:"todo", checks: base.checklist.map(() => false), files:[], note:"", groupId,
        log:[{ at:Date.now(), by:writerName(), act: asMgr(branch) && p.email !== myEmail() ? `배정 → ${p.name}` : "추가" }] });
      toast(ppl.length > 1 ? `${ppl.length}명에게 배정했어요.` : asMgr(branch) && ppl[0].email !== myEmail() ? `${ppl[0].name}에게 배정했어요.` : "업무를 추가했어요.");
    },
    onDelete: t && (isMgr(t.branch) || (t.createdBy === myEmail() && t.assignee === myEmail())) && (async () => { await DB.remove("tasks", t.id); toast("업무를 지웠어요."); }),
    deleteLabel: "업무 삭제"
  });
  $("dlg").classList.add("wide");
  dlgCtx.deleteMsg = t && `'${t.title}' 업무를 지울까요? 제출한 내용과 기록도 함께 지워져요.`;
  if (!t) $("dlgBody").addEventListener("change", e => {
    if (e.target.name === "pplAll") { $("dlgBody").querySelectorAll("input[name=ppl]").forEach(x => x.checked = e.target.checked && !(state.isAdmin && x.value === myEmail())); return; }
    if (e.target.name === "ppl" && !e.target.checked) { const a = $("dlgBody").querySelector("input[name=pplAll]"); if (a) a.checked = false; }
    if (e.target.name !== "branch") return; const b = e.target.value;
    $("whPpl").innerHTML = pplHTML(b, []); $("whNeedL").hidden = !asMgr(b); });
}
const whLog = (t, act, note) => [...(t.log || []), { at:Date.now(), by:writerName(), act, ...(note ? { note } : {}) }].slice(-40);

/* ── 업무 열기: 체크 · 메모 · 파일 · 제출 / 확인 · 보완 요청 ── */
function taskDialog(t){
  const mine = whMine(t), mgr = isMgr(t.branch) && (!mine || state.isAdmin);
  const editable = mine && ["todo","doing","revise"].includes(t.status);
  const { n } = whChecks(t);
  const fileList = () => (t.files || []).map((f, i) => { const u = DB.fileUrl(f), img = /^image\//.test(f.type || "") || /\.(jpe?g|png|gif|webp|heic)$/i.test(f.name || "");
    return `<li>${img && u ? `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt=""></a>` : ""}<a href="${esc(u || "#")}" target="_blank" rel="noopener">${esc(f.name)}</a><small>${sizeLabel(f.size || 0)}</small>
      ${editable ? `<button type="button" class="icon-btn" data-wh-delfile="${i}">빼기</button>` : ""}</li>`; }).join("");
  openForm({
    title: t.title,
    fields: `<div class="wh-meta">${stPill(t)}<span>${esc(BRANCHES[t.branch])}</span><span>담당 <b>${esc(t.assigneeName)}</b></span>${t.due ? `<span class="due ${whLate(t) ? "late" : ""}">마감 ${md(t.due)} (${dueLabel(t.due)})</span>` : ""}
        <span>${t.routineId ? "루틴" : `${esc(t.writer || "")} 배정`}</span>${t.needCheck ? `<span class="tagb">확인 필요</span>` : ""}</div>
      ${t.status === "revise" && t.review?.note ? `<div class="wh-callout">보완 요청 (${esc(t.review.name || "")}): ${esc(t.review.note)}</div>` : ""}
      ${t.desc ? `<div class="man-body small wh-desc">${mdLite(t.desc)}</div>` : ""}
      ${n ? `<div class="fld"><span>체크리스트</span><ul class="wh-cl">${t.checklist.map((x, i) => `<li><label><input type="checkbox" name="ck${i}" ${(t.checks || [])[i] ? "checked" : ""} ${editable ? "" : "disabled"}>${esc(x)}</label></li>`).join("")}</ul></div>` : ""}
      ${editable ? fArea("결과 메모 <small>한 일, 특이사항</small>", "note", t.note || "", 'rows="3" maxlength="2000"') : t.note ? `<div class="fld"><span>결과 메모</span><p class="wh-note">${esc(t.note)}</p></div>` : ""}
      <div class="fld"><span>사진·파일 ${(t.files || []).length ? `<small>${t.files.length}개</small>` : ""}</span>
        <ul class="wh-files-l">${fileList()}</ul>
        ${editable ? `<input type="file" class="inp" name="whFiles" multiple accept="image/*,application/pdf,.xlsx,.xls,.docx,.hwp,.pptx"><div class="up-prog" hidden><i></i></div>` : (t.files || []).length ? "" : `<p class="hint small">없음</p>`}</div>
      ${mgr && t.status === "submitted" ? fArea("확인 의견 <small>보완 요청 때는 꼭 적어 주세요</small>", "rnote", "", 'rows="2" maxlength="500"') : ""}
      <div class="wh-acts">
        ${editable ? `<button type="button" class="btn btn-ghost btn-sm" data-wh="save">저장</button>
          <button type="button" class="btn btn-primary btn-sm" data-wh="${t.needCheck ? "submit" : "done"}">${t.needCheck ? (t.status === "revise" ? "다시 제출" : "제출하기") : "완료"}</button>` : ""}
        ${mine && t.status === "submitted" ? `<button type="button" class="btn btn-ghost btn-sm" data-wh="unsubmit">제출 취소</button>` : ""}
        ${mine && t.status === "done" && !t.needCheck ? `<button type="button" class="btn btn-ghost btn-sm" data-wh="reopen">완료 취소</button>` : ""}
        ${mgr && t.status === "submitted" ? `<button type="button" class="btn btn-ghost btn-sm" data-wh="revise">보완 요청</button><button type="button" class="btn btn-primary btn-sm" data-wh="approve">확인 완료</button>` : ""}
        ${mgr && t.status === "done" && t.needCheck ? `<button type="button" class="btn btn-ghost btn-sm" data-wh="reopenM">다시 열기</button>` : ""}
        ${isMgr(t.branch) || (t.createdBy === myEmail() && mine) ? `<button type="button" class="btn btn-ghost btn-sm" data-wh="edit">업무 수정</button>` : ""}
      </div>
      <details class="wh-log"><summary>기록 ${(t.log || []).length}</summary><ul>${(t.log || []).slice().reverse().map(l => `<li><b>${new Date(l.at).toLocaleString("ko-KR", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" })}</b> ${esc(l.by)} · ${esc(l.act)}${l.note ? ` — ${esc(l.note)}` : ""}</li>`).join("")}</ul></details>`,
    saveLabel: "닫기", async onSave(){ return true; }
  });
  $("dlg").classList.add("wide");
  const body = $("dlgBody");
  const gather = () => { const f = $("dlgForm"); return { checks: (t.checklist || []).map((_, i) => !!f.elements["ck" + i]?.checked), note: (f.elements.note?.value || "").trim() }; };
  const upload = async () => {
    const inp = body.querySelector("input[name=whFiles]"), fs = [...(inp?.files || [])]; if (!fs.length) return t.files || [];
    const big = fs.find(f => f.size > 50 * 1024 * 1024); if (big) throw new Error(`${big.name}: 50MB까지 올릴 수 있어요.`);
    const bar = body.querySelector(".up-prog"); bar.hidden = false; const out = [...(t.files || [])];
    for (const [i, f] of fs.entries()){ const v = await DB.putFile("task_" + t.id, f, p => bar.firstElementChild.style.width = Math.round((i + p / 100) / fs.length * 100) + "%");
      out.push({ ...v, name:f.name, type:f.type || "" }); }
    return out.slice(-20);
  };
  body.addEventListener("click", async e => {
    const b = e.target.closest("[data-wh],[data-wh-delfile]"); if (!b) return;
    const a = b.dataset.wh;
    try {
      if (b.dataset.whDelfile != null){ const i = +b.dataset.whDelfile, f = t.files[i]; const files = t.files.filter((_, j) => j !== i);
        await DB.update("tasks", t.id, { files, log: whLog(t, `파일 뺌: ${f.name}`) }); DB.dropFiles([f]); $("dlg").close(); taskDialog({ ...t, files }); return; }
      if (a === "edit"){ $("dlg").close(); taskForm(t); return; }
      b.disabled = true;
      if (["save","submit","done"].includes(a)){
        const g = gather();
        if (a !== "save" && g.checks.some(x => !x)) { b.disabled = false; return formErr("체크리스트를 모두 체크해야 " + (a === "submit" ? "제출" : "완료") + "할 수 있어요."); }
        const files = await upload();
        const status = a === "save" ? (t.status === "revise" ? "revise" : "doing") : a === "submit" ? "submitted" : "done";
        const patch = { ...g, files, status, log: whLog(t, a === "save" ? "중간 저장" : a === "submit" ? (t.status === "revise" ? "다시 제출" : "제출") : "완료") };
        if (a === "submit") patch.submittedAt = Date.now();
        if (a === "done") patch.doneAt = Date.now();
        await DB.update("tasks", t.id, patch);
        toast(a === "save" ? "저장했어요." : a === "submit" ? "제출했어요. 관리자가 확인하면 완료돼요." : "완료했어요. 결과 공유에 올라가요.");
      }
      if (a === "unsubmit") { await DB.update("tasks", t.id, { status:"doing", log: whLog(t, "제출 취소") }); toast("제출을 취소했어요."); }
      if (a === "reopen") { await DB.update("tasks", t.id, { status:"doing", doneAt:null, log: whLog(t, "완료 취소") }); toast("다시 진행 중으로 바꿨어요."); }
      if (a === "approve" || a === "revise"){
        const note = val($("dlgForm"), "rnote");
        if (a === "revise" && !note) { b.disabled = false; return formErr("무엇을 보완할지 적어 주세요."); }
        await DB.update("tasks", t.id, { status: a === "approve" ? "done" : "revise", ...(a === "approve" ? { doneAt:Date.now() } : {}),
          review:{ by:myEmail(), name:writerName(), at:Date.now(), note, decision:a }, revCount:(t.revCount || 0) + (a === "revise" ? 1 : 0),
          log: whLog(t, a === "approve" ? "확인 완료" : "보완 요청", note) });
        toast(a === "approve" ? "확인 완료했어요." : "보완을 요청했어요.");
      }
      if (a === "reopenM") { await DB.update("tasks", t.id, { status:"revise", doneAt:null, review:{ by:myEmail(), name:writerName(), at:Date.now(), note:"다시 확인 필요", decision:"revise" }, log: whLog(t, "다시 열기") }); toast("다시 열었어요."); }
      $("dlg").close();
    } catch (err) { b.disabled = false; formErr("저장하지 못했어요. " + (err.code || err.message || "")); }
  });
}

/* ── 루틴 만들기 · 수정 ── */
function routineForm(r){
  const bOpts = r ? [r.branch] : mgrBranches(); if (!bOpts.length) return;
  const b0 = r?.branch || (bOpts.includes(state.branch) ? state.branch : bOpts[0]);
  const ppl = (b, sel, all) => `<div class="fld"><span>담당자 <small>사람마다 그날 업무가 따로 생겨요. '전원'은 나중에 들어온 직원도 자동 포함</small></span><div class="wh-ppl">
    <label class="all"><input type="checkbox" name="pplAll" ${all ? "checked" : ""}>전원</label>${whPeople(b).map(p => `<label class="${all ? "dim" : ""}"><input type="checkbox" name="ppl" value="${esc(p.email)}" data-name="${esc(p.name)}" ${all || sel.includes(p.email) ? "checked" : ""} ${all ? "disabled" : ""}>${esc(p.name)}</label>`).join("") || `<span class="hint">이 원에 등록된 직원 계정이 없어요.</span>`}</div></div>`;
  const fq = r?.freq || "daily";

      <label class="chk"><input type="checkbox" name="needCheck" ${r?.needCheck ? "checked" : ""}> 확인 필요 (제출 → 관리자 확인)</label>

      ${r ? `<label class="chk"><input type="checkbox" name="active" ${r.active !== false ? "checked" : ""}> 사용 중 (끄면 새 업무가 생기지 않아요)</label>` : ""}`,

/* 루틴 → 그날 업무 만들기 (지난 7일 + 오늘). 관리자는 그 원 담당자 모두, 담당자는 자기 것만. 문서 ID 고정이라 두 번 생기지 않음 */
const routineDue = (r, d) => {
  if (r.active === false || d < (r.start || "0000")) return false;
  if (r.skipHol !== false && holidaysOf(+d.slice(0, 4)).has(d)) return false;
  const dt = parse(d);
  return r.freq === "daily" ? true : r.freq === "weekly" ? (r.days || []).includes(dt.getDay()) : dt.getDate() === +r.dom;
};
async function genRoutineTasks(){
  if (genRoutineTasks.busy || !state.user || !state.loaded.tasks || !state.loaded.routines) return;
  genRoutineTasks.busy = true;
  try {
    const have = new Set(state.tasks.map(t => t.id)), today = todayISO();
    for (const r of state.routines){
      if (r.active === false || !state.myBranches.concat(state.wide ? BRANCH_KEYS : []).includes(r.branch) && !state.isAdmin) continue;
      const list = r.allStaff ? whPeople(r.branch).filter(p => !(state.isAdmin && p.email === myEmail() && !state.members.some(m => m.id === p.email))) : (r.assignees || []);
      const who = list.filter(p => isMgr(r.branch) || p.email === myEmail());
      if (!who.length) continue;
      for (let i = 6; i >= 0; i--){
        const d = addDays(today, -i); if (!routineDue(r, d)) continue;
        for (const p of who){
          const id = `r_${r.id}_${d}_${whKey(p.email)}`; if (have.has(id)) continue;
          have.add(id);
          try { await DB.createOnce("tasks", id, { title:r.title, branch:r.branch, due:d, desc:r.desc || "", checklist:r.checklist || [], needCheck:!!r.needCheck,
            assignee:p.email, assigneeName:p.name, status:"todo", checks:(r.checklist || []).map(() => false), files:[], note:"", routineId:r.id, runDate:d,
            log:[{ at:Date.now(), by:"루틴", act:`루틴으로 생성 (${freqLabel(r)})` }] }); } catch (err) { console.warn("루틴 업무 생성 실패", id, err.code || err); }
        }
      }
    }
  } finally { genRoutineTasks.busy = false; }
}

          ${e.strengths ? `<p class="wh-note"><b>잘한 점</b> ${esc(e.strengths)}</p>` : ""}${e.gaps ? `<p class="wh-note"><b>보완할 점</b> ${esc(e.gaps)}</p>` : ""}${e.next ? `<p class="wh-note"><b>다음 단계</b> ${esc(e.next)}</p>` : ""}
          ${lv?.files?.length ? `<ul class="wh-files-l">${fileLinks(lv.files)}</ul>` : ""}</li>`; }).join("")}</ul></section>` : ""}`;

/* ── 미션 만들기 · 수정 ── */
function missionForm(m){

    .filter((p, i, a) => a.findIndex(x => x.email === p.email) === i);

    ${peopleOf(sc).map(p => `<label class="${have.has(p.email) ? "dim" : ""}"><input type="checkbox" name="ppl" value="${esc(p.email)}" data-name="${esc(p.name)}" data-branch="${p.branch}" ${have.has(p.email) ? "checked disabled" : ""}>${esc(p.name)}${sc === "all" ? `<small>${SHORT[p.branch]}</small>` : ""}</label>`).join("")}</div></div>`;
  const rub = m?.rubric || M_TYPES[t0].rubric;
  openForm({
    title: m ? "미션 수정" : "미션 만들기",
    fields: `<div class="row2">${fSelect("미션 종류", "type", Object.entries(M_TYPES).map(([k, x]) => [k, x.label]), t0, m ? "disabled" : "")}
        ${fSelect("범위", "branch", scopes.map(b => [b, scopeLabel(b)]), b0, m ? "disabled" : "")}</div>
      ${fText("미션 이름", "title", m?.title, 'required maxlength="100" placeholder="예: 11월 연구 PPT — 남아 협동 그리기 수업 설계"')}
      ${fArea("목표", "goal", m?.goal ?? "", 'rows="2" maxlength="1000"')}
      ${fArea("안내 <small>무엇을, 어떻게, 어떤 형식으로</small>", "guide", m?.guide ?? "", 'rows="4" maxlength="5000"')}
      ${fArea("필수 항목 <small>한 줄에 하나, 교사가 모두 체크해야 제출돼요</small>", "req", (m?.required || M_TYPES[t0].req).join("\n"), 'rows="4"')}
      ${fArea("평가 기준표 <small>한 줄에 '항목 배점' (합계 100 권장)</small>", "rubric", rub.map(r => `${r[0]} ${r[1]}`).join("\n"), 'rows="4"')}
      ${fDate("마감일", "due", m?.due || addDays(todayISO(), 14))}
      <div id="mhPpl">${pplHTML(b0)}</div>
      ${m ? `<label class="chk"><input type="checkbox" name="closed" ${m.status === "closed" ? "checked" : ""}> 마감 (더 이상 새 제출을 받지 않아요)</label>` : ""}`,
    saveLabel: m ? "수정 저장" : "미션 배정",
    async onSave(form){
      const type = m?.type || val(form, "type"), branch = m?.branch || val(form, "branch"), title = val(form, "title");
      if (!title) return formErr("미션 이름을 넣어 주세요.");
      const rubric = form.elements.rubric.value.split("\n").map(x => x.trim()).filter(Boolean).map(x => { const mm = x.match(/^(.*?)[\s:·]+(\d+)\s*(점)?$/); return mm ? [mm[1].trim(), +mm[2]] : null; });
      if (!rubric.length || rubric.some(r => !r)) return formErr("평가 기준표는 한 줄에 '항목 배점' 형식으로 적어 주세요. 예: 근거 30");
      const required = form.elements.req.value.split("\n").map(x => x.trim()).filter(Boolean).slice(0, 20);
      const ppl = [...form.querySelectorAll("input[name=ppl]:checked:not(:disabled)")].map(x => ({ email:x.value, name:x.dataset.name, branch:x.dataset.branch }));
      if (!m && !ppl.length) return formErr("대상 교사를 한 명 이상 골라 주세요.");
      const due = val(form, "due"), data = { title, goal: form.elements.goal.value.trim(), guide: form.elements.guide.value.trim(), required, rubric, due };
      let mid = m?.id;
      if (m) await DB.update("missions", m.id, { ...data, status: form.elements.closed.checked ? "closed" : "open", targets:[...(m.targets || []), ...ppl] });
      else mid = await DB.add("missions", { ...data, type, branch, status:"open", targets: ppl });
      for (const p of ppl) await DB.add("tasks", { title, branch:p.branch, due, desc: [data.goal && `**목표** ${data.goal}`, data.guide].filter(Boolean).join("\n\n"), checklist: required, checks: required.map(() => false),
        needCheck:true, assignee:p.email, assigneeName:p.name, status:"todo", files:[], note:"", versions:[], missionId:mid, mType:type, log:[{ at:Date.now(), by:writerName(), act:`미션 배정 → ${p.name}` }] });
      if (m){ // 기존 배정 건의 제목·마감·필수 항목 맞추기(이미 체크한 항목은 유지)
        for (const t of mTasks(m.id).filter(t => !["done"].includes(t.status))) await DB.update("tasks", t.id, { title, due, checklist: required, checks: required.map((x, i) => (t.checklist || []).indexOf(x) >= 0 ? !!(t.checks || [])[(t.checklist || []).indexOf(x)] : false) });
      }
      toast(m ? `미션을 수정했어요${ppl.length ? `. ${ppl.length}명을 새로 배정했어요` : ""}.` : `${ppl.length}명에게 미션을 배정했어요. 워크허브 '내 업무'와 캘린더에도 떠요.`);
      state.mhView = "list"; state.mhOpen = mid; renderView();
    },
    onDelete: m && (async () => { for (const t of mTasks(m.id)) { if ((t.versions || []).length) await DB.update("tasks", t.id, { status:"canceled" }); else await DB.remove("tasks", t.id); }
      await DB.remove("missions", m.id); state.mhOpen = null; toast("미션을 지웠어요. 이미 제출된 자료는 남겨 뒀어요."); }),
    deleteLabel: "미션 삭제"
  });
  $("dlg").classList.add("wide");
  dlgCtx.deleteMsg = m && `'${m.title}' 미션을 지울까요? 아직 제출하지 않은 배정은 지워지고, 제출된 자료와 평가는 남아요.`;
  $("dlgBody").addEventListener("change", e => {
    const b = $("dlgBody");
    if (e.target.name === "type" && !m){ const T = M_TYPES[e.target.value]; b.querySelector("[name=req]").value = T.req.join("\n"); b.querySelector("[name=rubric]").value = T.rubric.map(r => `${r[0]} ${r[1]}`).join("\n"); }
    if (e.target.name === "branch" && !m) $("mhPpl").innerHTML = pplHTML(e.target.value);
    if (e.target.name === "pplAll") b.querySelectorAll("input[name=ppl]:not(:disabled)").forEach(x => x.checked = e.target.checked);
  });
}

/* ── 교사: 미션 열기·제출 (제출할 때마다 버전이 하나씩 쌓임) ── */
function missionTaskDialog(t){
  const m = state.missions.find(x => x.id === t.missionId), mine = whMine(t), e = evalOf(t);
  if (!mine && isMgr(t.branch)) return evalDialog(t);
  const editable = mine && ["todo","doing","revise"].includes(t.status) && m?.status !== "closed";
  openForm({
    title: t.title,
    fields: `<div class="wh-meta">${stPill(t)}<span class="tagk">${esc(mTypeLabel(t.mType))}</span>${t.due ? `<span class="due ${whLate(t) ? "late" : ""}">마감 ${md(t.due)} (${dueLabel(t.due)})</span>` : ""}${m?.status === "closed" ? `<span class="tagb">마감된 미션</span>` : ""}</div>
      ${t.status === "revise" && t.review?.note ? `<div class="wh-callout">보완 요청 (${esc(t.review.name || "")}): ${esc(t.review.note)}</div>` : ""}
      ${e?.published ? evalCardHTML(e) : ""}
      ${m?.goal ? `<p class="wh-note"><b>목표</b> ${esc(m.goal)}</p>` : ""}${m?.guide ? `<div class="man-body small wh-desc">${mdLite(m.guide)}</div>` : ""}
      ${m?.rubric ? `<div class="fld"><span>평가 기준</span><div class="mh-scores">${m.rubric.map(r => `<span>${esc(r[0])} <b>${r[1]}</b>점</span>`).join("")}</div></div>` : ""}
      ${(t.checklist || []).length ? `<div class="fld"><span>필수 항목</span><ul class="wh-cl">${t.checklist.map((x, i) => `<li><label><input type="checkbox" name="ck${i}" ${(t.checks || [])[i] ? "checked" : ""} ${editable ? "" : "disabled"}>${esc(x)}</label></li>`).join("")}</ul></div>` : ""}
      ${editable ? fArea("설명 <small>무엇을 했는지, 의도, 참고한 것</small>", "note", t.note || "", 'rows="4" maxlength="5000"') : ""}
      ${editable ? `<div class="fld"><span>결과물 파일 <small>PDF·PPTX·DOCX·XLSX·CSV·사진, 파일당 100MB</small></span><ul class="wh-files-l">${(t.files || []).map((f, i) => `<li>${esc(f.name)} <small>${sizeLabel(f.size || 0)}</small><button type="button" class="icon-btn" data-mh-del="${i}">빼기</button></li>`).join("")}</ul>
        <input type="file" class="inp" name="mFiles" multiple accept="image/*,.pdf,.pptx,.ppt,.docx,.doc,.xlsx,.xls,.csv,.hwp"><div class="up-prog" hidden><i></i></div></div>` : ""}
      ${(t.versions || []).length ? `<div class="fld"><span>제출 기록</span><ul class="mh-vers">${t.versions.slice().reverse().map(v => `<li><b>v${v.v}</b> ${new Date(v.at).toLocaleString("ko-KR", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" })}${v.note ? `<p class="wh-note">${esc(v.note)}</p>` : ""}<ul class="wh-files-l">${fileLinks(v.files)}</ul></li>`).join("")}</ul></div>` : ""}
      <div class="wh-acts">${editable ? `<button type="button" class="btn btn-ghost btn-sm" data-mh="save">임시 저장</button><button type="button" class="btn btn-primary btn-sm" data-mh="submit">${(t.versions || []).length ? "다시 제출" : "제출하기"}</button>` : ""}
        ${mine && t.status === "submitted" && !e ? `<button type="button" class="btn btn-ghost btn-sm" data-mh="unsubmit">제출 취소</button>` : ""}</div>`,
    saveLabel: "닫기", async onSave(){ return true; }
  });
  $("dlg").classList.add("wide");
  const body = $("dlgBody");
  body.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-mh],[data-mh-del]"); if (!b) return;
    try {
      if (b.dataset.mhDel != null){ const i = +b.dataset.mhDel, files = t.files.filter((_, j) => j !== i); await DB.update("tasks", t.id, { files }); $("dlg").close(); missionTaskDialog({ ...t, files }); return; }
      const a = b.dataset.mh; b.disabled = true;
      if (a === "unsubmit") { const vers = (t.versions || []).slice(0, -1); await DB.update("tasks", t.id, { status:"doing", versions:vers, log: whLog(t, "제출 취소") }); $("dlg").close(); toast("제출을 취소했어요."); return; }
      const f = $("dlgForm"), checks = (t.checklist || []).map((_, i) => !!f.elements["ck" + i]?.checked), note = (f.elements.note?.value || "").trim();
      const inp = body.querySelector("input[name=mFiles]"), fs = [...(inp?.files || [])];
      if (fs.some(x => x.size > 100 * 1024 * 1024)) { b.disabled = false; return formErr("파일당 100MB까지 올릴 수 있어요."); }
      let files = [...(t.files || [])];
      if (fs.length){ const bar = body.querySelector(".up-prog"); bar.hidden = false;
        for (const [i, x] of fs.entries()){ const v = await DB.putFile("mission_" + t.id, x, p => bar.firstElementChild.style.width = Math.round((i + p / 100) / fs.length * 100) + "%"); files.push({ ...v, name:x.name, type:x.type || "", nas:"wait" }); } }
      if (a === "submit"){
        if (checks.some(x => !x)) { b.disabled = false; return formErr("필수 항목을 모두 체크해야 제출할 수 있어요."); }
        if (!files.length) { b.disabled = false; return formErr("결과물 파일을 하나 이상 올려 주세요."); }
        const v = ((t.versions || []).at(-1)?.v || 0) + 1;
        await DB.update("tasks", t.id, { checks, note, files, status:"submitted", submittedAt:Date.now(), versions:[...(t.versions || []), { v, at:Date.now(), note, files, checks }].slice(-10), log: whLog(t, `제출 v${v}`) });
        // NAS 저장 작업 — 대치원 서버 PC의 커넥터가 가져가서 교사 폴더에 저장
        for (const [i, f] of files.entries()) if (f.path) await DB.set("nasJobs", `${t.id}_v${v}_${i}`, { taskId:t.id, v, idx:i, storagePath:f.path, name:f.name, size:f.size || 0,
          teacher:t.assignee, teacherName:t.assigneeName, branch:t.branch, missionTitle:t.title, mType:t.mType, year:new Date().getFullYear(), status:"wait", attempts:0, createdAt:Date.now(), createdBy:myEmail() });
        toast(`제출했어요 (v${v}). 관리자가 평가하면 알려 드려요.`);
      } else { await DB.update("tasks", t.id, { checks, note, files, status: t.status === "revise" ? "revise" : "doing", log: whLog(t, "임시 저장") }); toast("임시 저장했어요."); }
      $("dlg").close();
    } catch (err) { b.disabled = false; formErr("저장하지 못했어요. " + (err.code || err.message || "")); }
  });
}

 "evidence":["항목별 근거(파일·쪽·슬라이드 번호)"],

        ${lv ? `<button type="button" class="btn btn-primary btn-sm" data-ev="publish">${e.published ? "다시 확정" : "확정하고 공개"}</button>` : ""}</div>`,
    saveLabel: "닫기", async onSave(){ return true; }
  });
  $("dlg").classList.add("wide");
  const body = $("dlgBody"), F = () => $("dlgForm");
  let aiUsed = !!e.aiUsed;
  body.addEventListener("input", ev => { if (/^sc\d+$/.test(ev.target.name)) $("evSum").textContent = `합계 ${sumOf(F())} / ${max}`; });
  body.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-ev]"); if (!b) return; const a = b.dataset.ev;
    if (a === "copy"){ try { await navigator.clipboard.writeText(aiPrompt(t, m, lv)); toast("평가 요청문을 복사했어요. AI 채팅에 붙여넣고 제출 파일을 함께 올려 주세요."); } catch { formErr("복사하지 못했어요. 브라우저 권한을 확인해 주세요."); } return; }
    if (a === "paste"){
      const raw = F().elements.aiRaw.value, j = raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1);
      try { const o = JSON.parse(j); (o.scores || []).forEach((s, i) => { const el = F().elements["sc" + i]; if (el && s !== "" && s != null && !isNaN(+s)) el.value = Math.min(rub[i][1], Math.max(0, Math.round(+s))); });
        ["strengths","gaps","next"].forEach(k => { if (o[k]) F().elements[k].value = String(o[k]); });
        aiUsed = true; $("evSum").textContent = `합계 ${sumOf(F())} / ${max}`; toast("AI 답으로 칸을 채웠어요. 확인하고 고쳐 주세요."); $("dlgErr").textContent = ""; }
      catch { formErr("AI 답에서 JSON을 찾지 못했어요. { 로 시작해서 } 로 끝나는 부분을 붙여넣어 주세요."); }
      return;
    }
    const f = F(), scores = rub.map((r, i) => f.elements["sc" + i].value === "" ? null : Math.min(r[1], Math.max(0, Math.round(+f.elements["sc" + i].value))));
    const base = { branch:t.branch, teacher:t.assignee, teacherName:t.assigneeName, missionId:t.missionId, missionTitle:m?.title || t.title, mType:t.mType, rubric:rub, scores, total:sumOf(f), max,
      strengths:f.elements.strengths.value.trim(), gaps:f.elements.gaps.value.trim(), next:f.elements.next.value.trim(), version: lv?.v || 0, aiUsed, by:myEmail(), name:writerName(), at:Date.now() };
    b.disabled = true;
    try {
      if (a === "publish"){
        if (scores.some(s => s == null)) { b.disabled = false; return formErr("모든 항목에 점수를 넣어야 확정할 수 있어요."); }
        await DB.set("evals", t.id, { ...base, published:true, publishedAt:Date.now(), history:[...(e.history || []), ...(e.published ? [{ total:e.total, at:e.publishedAt, by:e.name }] : [])].slice(-10) });
        await DB.update("tasks", t.id, { status:"done", doneAt:Date.now(), review:{ by:myEmail(), name:writerName(), at:Date.now(), note:"평가 확정", decision:"approve" }, log: whLog(t, `평가 확정 ${base.total}/${max}`) });
        toast("평가를 확정했어요. 교사에게 점수와 피드백이 공개돼요.");
      } else if (a === "revise"){
        const note = base.gaps || ""; if (!note) { b.disabled = false; return formErr("'보완할 점'에 무엇을 보완할지 적어 주세요."); }
        await DB.set("evals", t.id, { ...base, published:false, history:e.history || [] });
        await DB.update("tasks", t.id, { status:"revise", review:{ by:myEmail(), name:writerName(), at:Date.now(), note, decision:"revise" }, revCount:(t.revCount || 0) + 1, log: whLog(t, "보완 요청", note) });
        toast("보완을 요청했어요.");
      } else { await DB.set("evals", t.id, { ...base, published:!!e.published, publishedAt:e.publishedAt || null, history:e.history || [] }); toast("임시 저장했어요. 교사에게는 아직 안 보여요."); }
      $("dlg").close();
    } catch (err) { b.disabled = false; formErr("저장하지 못했어요. " + (err.code || err.message || "")); }
  });
}

const MANUAL_CATS = [["teacher","교사"],["manager","실장"],["counsel","상담"],["common","공통"]];

const manCatList = () => state.manCats.length ? state.manCats.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.at || 0) - (b.at || 0)).map(c => [c.id, c.name])

// 내용 종류: text(글) · html(HTML 문서, 문서 안에 저장) · pdf(Storage 파일)
const manType = m => m.type || "text";
const htmlText = h => String(h || "").replace(/<(script|style|head|title)[\s\S]*?<\/\1>/gi, " ").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/\s+/g, " ").trim();
const manSearchText = m => m.title + "\n" + (manType(m) === "html" ? htmlText(m.html) : manType(m) === "pdf" ? (m.file?.name || "") + " " + (m.body || "") : m.body || "");
const manPreview = m => manType(m) === "pdf" ? `PDF · ${m.file?.name || ""}${m.body ? " · " + m.body : ""}` : manType(m) === "html" ? htmlText(m.html)
  : String(m.body || "").split("\n").map(x => x.replace(/^[#\-*\d.)\s]+/, "").replace(/\*\*/g, "")).find(x => x.trim()) || "";
function manViewHTML(m){
  const t = manType(m);
  if (t === "pdf"){
    const url = m.file ? DB.fileUrl(m.file) : null;
    if (!url) return `<p class="empty">PDF 파일을 찾지 못했어요.</p>`;
    return `${m.body ? `<p class="man-desc">${esc(m.body)}</p>` : ""}<div class="man-fileacts"><span>${esc(m.file.name || "PDF")} · ${sizeLabel(m.file.size || 0)}</span>
      <a class="icon-btn" href="${esc(url)}" target="_blank" rel="noopener">새 창으로 열기</a></div>
      <iframe class="man-frame" src="${esc(url)}" title="${esc(m.title)}"></iframe>`;
  }
  if (t === "html"){
    // 다른 출처로 격리해서 보여줌(allow-same-origin 없음) — 문서 안 스크립트가 JP ONE에 접근하지 못함
    return `<div class="man-fileacts"><span>HTML 문서</span><button type="button" class="icon-btn" data-act="man-pop" data-id="${esc(m.id)}">새 창으로 보기</button></div>
      <iframe class="man-frame" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-modals" srcdoc="${esc(m.html || "")}" title="${esc(m.title)}"></iframe>`;
  }
  return `<div class="man-body">${mdLite(m.body) || `<p class="empty">아직 내용이 없어요.</p>`}</div>`;
}
function mdLite(src){
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, a, u) => `<a href="${u}" target="_blank" rel="noopener">${a}</a>`);
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of String(src || "").split("\n")){
    const l = raw.trimEnd();
    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { close(); const h = m[1].length + 1; out.push(`<h${h}>${inline(m[2])}</h${h}>`); }
    else if ((m = l.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (!l.trim()) { close(); }
    else { close(); out.push(`<p>${inline(l)}</p>`); }
  }
  close();
  return out.join("");
}

    case "notice-edit": noticeForm(state.notices.find(x => x.id === id)); break;
    case "notice-open": state.openNotice = id; goTab("notice"); break;

      await new Promise(r => setTimeout(r, 300));

        end: val(form,"end"), repeat: val(form,"repeat"), until: val(form,"until"), memo: val(form,"memo"), major: form.elements.major.checked };
      if (!data.title) return formErr("일정 이름을 넣어 주세요.");
      if (!data.date) return formErr("날짜를 골라 주세요.");
      if (data.end && data.end < data.date) return formErr("끝나는 날이 시작 날보다 빨라요.");
      if (data.repeat === "weekly" && data.end) return formErr("매주 반복 일정에는 끝나는 날 대신 '반복 끝'을 써 주세요.");
      if (data.until && data.until < data.date) return formErr("반복 끝 날짜가 시작 날보다 빨라요.");
      if (!branchOptions("events").includes(data.branch)) return formErr("이 범위에는 일정을 올릴 수 없어요.");
      keepWriter(form);
      if (ev) await DB.update("events", ev.id, data); else await DB.add("events", data);
      const d = parse(data.date); state.cal = { y:d.getFullYear(), m:d.getMonth(), sel:data.date };
      toast(ev ? "일정을 수정했어요." : "일정을 추가했어요.");
    },
    onDelete: ev && (async () => { await DB.remove("events", ev.id); toast("일정을 삭제했어요."); })
  });
  dlgCtx.deleteMsg = ev && (ev.repeat === "weekly" ? `'${ev.title}' 반복 일정 전체가 지워져요. 삭제할까요?` : `'${ev.title}' 일정을 삭제할까요?`);
}

/* ── 자료실 폴더 (대표만 추가·이름 변경·순서·삭제) ── */
const folderList = () => state.folders.slice().sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || (a.at || 0) - (b.at || 0));
async function seedFolders(){   // 폴더가 하나도 없을 때 대표가 버튼으로 기본 폴더를 만듦
  if (seedFolders.busy) return; seedFolders.busy = true;
  try { for (const [i, f] of DEFAULT_FOLDERS.entries()) await DB.set("folders", f.id, { name:f.name, order:i + 1, branch:"all", at:Date.now(), createdBy:state.user.email, writer:writerName() }); toast("기본 폴더를 만들었어요."); }
  finally { seedFolders.busy = false; }
}
function folderForm(fd){
  const fl = folderList(), idx = fd ? fl.findIndex(x => x.id === fd.id) : -1, n = fd ? state.files.filter(f => f.folder === fd.id).length : 0;
  openForm({
    title: fd ? "폴더 수정" : "폴더 추가",
    fields: `${fText("폴더 이름", "name", fd?.name, 'required maxlength="20" placeholder="예: 학부모 안내문"')}
      ${fd ? `<div class="fld"><span>순서</span><div class="ord">
        <button type="button" class="icon-btn" data-ord="-1" ${idx <= 0 ? "disabled" : ""}>위로</button>
        <button type="button" class="icon-btn" data-ord="1" ${idx >= fl.length - 1 ? "disabled" : ""}>아래로</button>
        <span class="hint">${idx + 1}번째 / ${fl.length}개</span></div></div>
        <p class="hint">이 폴더에 파일 ${n}개가 있어요.${n ? " 폴더를 지우면 파일은 지워지지 않고 '분류 안 됨'으로 옮겨져요." : ""}</p>` : ""}`,

    async onSave(form){
      const name = val(form, "name");
      if (!name) return formErr("폴더 이름을 넣어 주세요.");
      if (fl.some(x => x.name === name && x.id !== fd?.id)) return formErr("같은 이름의 폴더가 이미 있어요.");
      if (fd) await DB.update("folders", fd.id, { name });
      else await DB.add("folders", { name, branch:"all", order: Math.max(0, ...fl.map(x => x.order || 0)) + 1 });
      toast(fd ? "폴더 이름을 바꿨어요." : "폴더를 추가했어요.");
    },
    onDelete: fd && (async () => {
      for (const f of state.files.filter(f => f.folder === fd.id)) await DB.update("files", f.id, { folder:"" });
      await DB.remove("folders", fd.id); if (state.folder === fd.id) state.folder = "all";
      toast(n ? `폴더를 지우고 파일 ${n}개를 '분류 안 됨'으로 옮겼어요.` : "폴더를 지웠어요.");
    }),
    deleteLabel: "폴더 삭제"
  });
  dlgCtx.deleteMsg = fd && `'${fd.name}' 폴더를 지울까요?${n ? ` 안의 파일 ${n}개는 '분류 안 됨'으로 옮겨져요.` : ""}`;
  $("dlgBody").querySelectorAll("[data-ord]").forEach(b => b.addEventListener("click", async () => {
    const j = idx + Number(b.dataset.ord), other = fl[j]; if (!other) return;

    await DB.update("folders", fd.id, { order: c === a ? c + Number(b.dataset.ord) : c }); await DB.update("folders", other.id, { order: a });
    const typed = val($("dlgForm"), "name");
    $("dlg").close(); folderForm(state.folders.find(x => x.id === fd.id));
    if (typed) $("dlgForm").elements.name.value = typed; toast("순서를 바꿨어요.");
  }));
}

/* ── 자료실: 올리기 · 상세(버전) ── */
function uploadForm(files, target){
  const big = files.filter(f => f.size > MAX_FILE_MB * 1048576);
  if (big.length) { toast(`${big.map(f => f.name).join(", ")}: ${MAX_FILE_MB}MB가 넘어서 올릴 수 없어요.`); files = files.filter(f => !big.includes(f)); }
  if (!files.length) return;
  const fl0 = folderList(), folder0 = target?.folder || (fl0.some(f => f.id === state.folder) ? state.folder : fl0[0]?.id || "");
  openForm({
    title: target ? "새 버전 올리기" : `파일 올리기 (${files.length}개)`,
    fields: `<ul class="uplist">${files.map((f,i) => `<li><span class="un">${esc(f.name)}</span><span class="us">${sizeLabel(f.size)}</span>
        <span class="bar"><i id="up-${i}"></i></span></li>`).join("")}</ul>
      ${target ? `<p class="hint">'${esc(target.name)}'의 새 버전으로 올라가요. 이전 버전은 그대로 남아요.</p>
           ${fArea("이번 버전에서 바뀐 점 (선택)", "note", "", 'rows="2" maxlength="200" placeholder="예: 3월 일정 반영, 오타 수정"')}`
        : `${fArea("설명", "desc", "", `rows="3" maxlength="500" required placeholder="어떤 자료인지, 언제·어떻게 쓰는지 적어 주세요.${files.length > 1 ? " (올리는 파일 모두에 같은 설명이 붙어요)" : ""}"`)}
           <div class="row2">${fSelect("폴더", "folder", folderList().map(f => [f.id, f.name]), folder0)}${fBranch("files", state.branch)}</div>
           ${fWriter()}`}`,
    saveLabel: "올리기",
    async onSave(form){
      const folder = target ? target.folder : val(form,"folder"), branch = target ? target.branch : val(form,"branch");
      if (!target && !branchOptions("files").includes(branch)) return formErr("이 범위에는 파일을 올릴 수 없어요.");
      const desc = target ? "" : val(form,"desc").trim(), note = target ? val(form,"note").trim() : "";
      if (!target && !desc) return formErr("자료 설명을 적어 주세요.");
      if (!target) keepWriter(form);
      for (let i = 0; i < files.length; i++){
        const f = files[i], bar = $(`up-${i}`), prog = p => { if (bar) bar.style.width = p + "%"; };
        if (target){
          const ver = await DB.putFile(target.id, f, prog);
          if (note) ver.note = note;
          await DB.update("files", target.id, { versions:[...(target.versions || []), ver], size:f.size });
        } else {
          // 같은 폴더·범위에 같은 이름이 있으면 새 버전으로 쌓기
          const same = state.files.find(x => x.name === f.name && x.folder === folder && x.branch === branch);
          const id = same ? same.id : DB.newId(), ver = await DB.putFile(id, f, prog);
          if (same) await DB.update("files", id, { versions:[...(same.versions || []), ver], size:f.size, desc });
          else await DB.addWithId("files", id, { name:f.name, desc, folder, branch, size:f.size, versions:[ver] });
        }
      }
      toast(target ? "새 버전을 올렸어요." : `파일 ${files.length}개를 올렸어요.`);
    }
  });
}

function fileDetail(f){
  if (!f) return;
  const vs = (f.versions || []).slice().reverse(), editable = canEdit(f);
  openForm({
    title: "파일 정보",
    fields: `<div class="fdet"><b>${esc(f.name)}</b>
        <span>${esc(fileType(f.name))}, ${sizeLabel(f.size || 0)}, ${esc(folderList().find(x => x.id === f.folder)?.name || "분류 안 됨")}, ${esc(scopeLabel(f.branch))}</span></div>
      ${editable ? fArea("설명", "desc", f.desc || "", 'rows="3" maxlength="500" placeholder="어떤 자료인지, 언제·어떻게 쓰는지 적어 주세요."')
        : `<p class="fdesc" style="-webkit-line-clamp:unset">${f.desc ? esc(f.desc) : "설명이 없어요."}</p>`}
      <h3 class="vh">버전 ${vs.length}개 <small>위가 최신</small></h3>
      <ul class="vlist">${vs.map((v,i) => { const url = DB.fileUrl(v);
        return `<li><span>${i === 0 ? "<b>최신</b> " : ""}${new Date(v.at).toLocaleDateString("ko-KR")} ${esc(v.by || "")}, ${sizeLabel(v.size || 0)}${v.note ? `<span class="vnote">${esc(v.note)}</span>` : ""}</span>
          ${url ? `<a href="${esc(url)}" download="${esc(f.name)}" target="_blank" rel="noopener">받기</a>` : `<span class="nofile">샘플</span>`}</li>`; }).join("")}</ul>
      ${editable ? `<button type="button" class="btn btn-ghost btn-sm" id="newVerBtn">새 버전 올리기</button>` : ""}`,
    saveLabel: editable ? "저장" : "닫기",
    async onSave(form){
      if (!editable) return true;
      const desc = val(form,"desc").trim();
      if (desc !== (f.desc || "")) { await DB.update("files", f.id, { desc }); toast("설명을 저장했어요."); }
      return true;
    },
    onDelete: editable && (async () => { await DB.dropFiles(f.versions || []); await DB.remove("files", f.id); toast("파일을 삭제했어요."); }),
    deleteLabel: "파일 삭제"
  });
  dlgCtx.deleteMsg = `'${f.name}'과 이전 버전 ${Math.max(0, vs.length - 1)}개가 모두 지워져요. 삭제할까요?`;
  $("newVerBtn")?.addEventListener("click", () => {
    const pick = document.createElement("input"); pick.type = "file";
    pick.onchange = () => { if (pick.files[0]) { $("dlg").close(); uploadForm([pick.files[0]], f); } };
    pick.click();
  });
}


/* =====================================================================
   직원 계정 (대표 전용)
   여기 등록된 구글 계정만 JP ONE에 로그인할 수 있음. 문서 ID = 구글 이메일(소문자)
   보안 규칙(firestore.rules · storage.rules)이 이 목록을 보고 권한을 판단함
   ===================================================================== */
// 직원 계정 수정: 예전 문서(branch 한 개)는 고칠 때 branches 목록으로 바꿔 저장 (보안 규칙이 이 모양을 요구)
function memUpdate(id, patch){
  const m = state.members.find(x => x.id === id);
  return DB.update("members", id, { branches: memBranches(m), ...patch, branch: null });
}
// 원 체크 상자 (여러 개 고를 수 있음)
const memChecks = (name, sel, label = "") => `<span class="mem-br" role="group" aria-label="${esc(label)} 소속 원">${BRANCH_KEYS.map(b =>
  `<label><input type="checkbox" ${name} value="${b}" ${sel.includes(b) ? "checked" : ""}>${SHORT[b]}</label>`).join("")}</span>`;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function membersDialog(){
  if (!state.isAdmin) return;
  openForm({

    fields: `<p class="hint">여기 있는 구글 계정만 JP ONE에 로그인할 수 있어요. 선생님은 <b>본인 구글 계정</b>으로 로그인해서 소속 원의 공지·일정·자료를 보고 써요.
        원 공용 계정(네이버 메일)도 지금처럼 쓸 수 있어요.

        <b>관리자</b>(원장·부원장·실장)는 워크허브에서 소속 원 업무를 배정하고 결과를 확인해요. 매출·미납액과 이 직원 계정 화면은 대표만 봐요.</p>
      <div><button type="button" class="btn btn-ghost btn-sm" id="memImport">JP People에서 불러오기</button></div>
      <div class="mem-wrap" id="memList"></div>
      <h3 class="vh">직접 추가</h3>
      <div class="mem-add">${fText("이름", "mName", "", 'maxlength="20"')}${fText("구글 이메일", "mEmail", "", 'type="email" placeholder="example@gmail.com"')}
        <div class="fld"><span>소속 원</span>${memChecks('name="mBr"', state.branch !== "all" ? [state.branch] : [], "새 직원")}</div>
        <button type="button" class="btn btn-sub btn-sm" id="memAdd">추가</button></div>`,

        if (!branches.length) return formErr("소속 원을 하나 이상 골라 주세요.");
        if (ADMIN_EMAILS.includes(email) || BRANCH_BY_EMAIL[email]) return formErr("대표나 원 공용 계정은 따로 등록하지 않아도 돼요.");
        if (state.members.some(m => m.id === email)) return formErr("이미 등록된 이메일이에요.");
        await DB.set("members", email, { email, name, branches, active:true, source:"manual", at:Date.now(), by:state.user.email });

        toast(`${name} 선생님을 등록했어요.`);
      }
      if (t.id === "memImport") memImport();

      }

  });
}

/* JP People 직원 목록(이름·구글 이메일·소속·재직 상태만) → 바뀔 내용 미리보기 → 고른 것만 적용 */
async function loadPeopleAccounts(db){
  const F = fb.F;
  const [orgSnap, empSnap] = await Promise.all([F.getDocs(F.collection(db, "orgs")), F.getDocs(F.collection(db, "employees"))]);
  const orgBranch = {}; orgSnap.forEach(d => { orgBranch[d.id] = branchOfCenter(d.data().name || ""); });
  const out = [];
  empSnap.forEach(d => { const e = d.data(); if (e.deleted) return;
    // JP People 최고관리자·대표이사는 3개 원 전체, 그 밖에는 소속 지점 전부(겸임이면 여러 개)

/* ── 과거 매출 올리기 (대표 전용): 월별 합계표 · 일별 매출표 → portalRevenue/{원} ──
   표 모양: ① 열 제목에 평촌·반포·대치 (원별 금액 열) ② '원' 열 + 금액 열 ③ 금액 열 하나(원은 직접 고름).
   날짜 칸이 '2025-11'·'2025.11'·'2025년 11월'이면 월별, '2026-10-01'·엑셀 날짜면 일별. 합계 줄은 건너뜀 */
const revNum = v => { if (typeof v === "number") return v; const t = String(v ?? "").replace(/[,원\s₩]/g, ""); if (!/^-?\d+(\.\d+)?$/.test(t)) return null; return +t; };
function revDate(v, yearHint){
  if (v instanceof Date && !isNaN(v)) { const x = new Date(v.getTime() + 12 * 36e5); return { d: `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}` }; }
  if (typeof v === "number" && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return { d: `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}` }; }
  const t = String(v ?? "").trim(); if (!t || /합계|소계|total/i.test(t)) return null;
  let m = t.match(/^(\d{2,4})\s*[-./년]\s*(\d{1,2})\s*[-./월]?\s*(?:(\d{1,2})\s*일?)?\s*(?:\(.\))?$/);
  if (m){ let y = +m[1]; if (y < 100) y += 2000; if (+m[2] < 1 || +m[2] > 12) return null;
    return m[3] ? { d: `${y}-${pad2(+m[2])}-${pad2(+m[3])}` } : { m: `${y}-${pad2(+m[2])}` }; }
  m = t.match(/^(\d{1,2})\s*[/.월]\s*(\d{1,2})\s*일?\s*(?:\(.\))?$/);
  if (m && yearHint) return { d: `${yearHint}-${pad2(+m[1])}-${pad2(+m[2])}` };
  return null;
}
async function readRevFile(file){
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type:"array", cellDates:true });
  const yHint = (file.name.match(/20\d{2}/) || [String(new Date().getFullYear())])[0];
  const recs = [];   // { b|null, key, kind:'m'|'d', amt }
  for (const sn of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:true, defval:"" });
    // 날짜 열: 날짜로 읽히는 칸이 가장 많은 열
    const W = Math.max(0, ...aoa.slice(0, 400).map(r => r.length));
    let dc = -1, best = 0;
    for (let c = 0; c < W; c++){ const n = aoa.reduce((a, r) => a + (revDate(r[c], yHint) ? 1 : 0), 0); if (n > best) { best = n; dc = c; } }
    if (dc < 0 || best < 1) continue;
    const firstData = aoa.findIndex(r => revDate(r[dc], yHint));
    // 머리글 = 첫 날짜 줄 위쪽에서 글자가 가장 많은 줄
    let hi = -1; for (let i = firstData - 1; i >= Math.max(0, firstData - 6); i--){ if (aoa[i].some(x => String(x).trim())) { hi = i; break; } }
    const head = hi >= 0 ? aoa[hi].map(x => String(x).replace(/\s/g, "")) : [];
    const brCols = head.map((h, c) => [branchOfCenter(h), c]).filter(([b, c]) => b && c !== dc);
    const brCol = head.findIndex(h => /^(원|지점|센터|센터명|지점명|원명)$/.test(h));
    const amtCol = (() => { const i = head.findIndex((h, c) => c !== dc && /매출|금액|합계|총액|결제/.test(h)); if (i >= 0) return i;
      for (let c = 0; c < W; c++) if (c !== dc && c !== brCol && aoa.slice(firstData, firstData + 30).filter(r => revNum(r[c]) != null).length > 0) return c; return -1; })();
    for (let i = firstData; i < aoa.length; i++){
      const r = aoa[i], dt = revDate(r[dc], yHint); if (!dt) continue;
      const key = dt.d || dt.m, kind = dt.d ? "d" : "m";
      if (brCols.length) { for (const [b, c] of brCols){ const v = revNum(r[c]); if (v != null) recs.push({ b, key, kind, amt:v }); } }
      else if (brCol >= 0 && amtCol >= 0) { const b = branchOfCenter(String(r[brCol])), v = revNum(r[amtCol]); if (b && v != null) recs.push({ b, key, kind, amt:v }); }
      else if (amtCol >= 0) { const v = revNum(r[amtCol]); if (v != null) recs.push({ b:null, key, kind, amt:v }); }
    }
  }
  return { recs, guess: branchOfCenter(file.name) };
}

const CW = 560, CH = 200, CH0 = 200, CP = { l:44, r:16, t:16, b:26 };
function niceTicks(min, max, count = 4){
  if (max === min) { max = min + 1; }
  const raw = (max - min) / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m => m * mag).find(s => (max - min) / s <= count) || mag * 10;

function lineChart({ labels, series, fmtV = v => v, zero = false, fixMax = null, fixMin = null, h = null, aria }){
  const CH = h || CH0;

  const x = i => CP.l + (CW - CP.l - CP.r) * (labels.length === 1 ? .5 : i / (labels.length - 1));

    ${ticks.map(t => `<line x1="${CP.l}" x2="${CW-CP.r}" y1="${y(t)}" y2="${y(t)}" stroke="#ECECEC"/><text x="${CP.l-8}" y="${y(t)+4}" text-anchor="end" class="ax">${esc(fmtV(t))}</text>`).join("")}
    ${labels.map((l,i) => (labels.length <= 12 || i % 2 === 0) ? `<text x="${x(i)}" y="${CH-6}" text-anchor="middle" class="ax">${esc(l)}</text>` : "").join("")}

  </svg>`;
}

/* ── 교사별 운영지표: 기간(1·3·6·12개월) 선택 ──

   샘플 = 그 기간 샘플수업으로 남아 있는 원생 + 그 기간 신규 등록(샘플을 거쳐 등록한 것으로 봄), 등록 = 신규 등록 */
const KPI_PERIODS = [[1, "1개월"], [3, "3개월"], [6, "6개월"], [12, "1년"]];
const periodLabel = () => { const n = state.kpiPeriod; return n === 1 ? "이번 달" : n === 12 ? "최근 1년" : `최근 ${n}개월`; };
const ymNext = ym => { const [y, m] = ym.split("-").map(Number); return m === 12 ? `${y+1}-01` : `${y}-${pad2(m+1)}`; };
// 교사 이름 → 계산 시작 달(입사 다음 달). 같은 원 우선, 없으면 다른 원
function teacherStart(name, branch){
  const hit = state.teachers.find(t => t.name === name && t.branch === branch) || state.teachers.find(t => t.name === name);
  return hit ? { from: ymNext(hit.startYm), startYm: hit.startYm, active: hit.active !== false } : null;
}
function teacherPeriod(t, snap){
  const n = state.kpiPeriod, months = snap.months, first = 12 - n;
  const st = teacherStart(t.name, snap.branch);
  const idx = []; for (let i = first; i < 12; i++) if (!st || months[i] >= st.from) idx.push(i);
  const sum = k => idx.reduce((a, i) => a + (t.m[k][i] || 0), 0);
  const pre = idx.length ? (idx[0] === 0 ? t.m.enr0 : t.m.enr[idx[0] - 1]) : 0;   // 기간 시작 직전 월말 재원
  const newc = sum("new"), left = sum("left"), smp = sum("smp") + newc;
  // 월별 퇴원율 = 그 달 퇴원 ÷ (전달 말 재원 + 그 달 신규), 기간 평균
  const mr = idx.map(i => { const b = (i === 0 ? t.m.enr0 : t.m.enr[i - 1]) + t.m.new[i]; return b ? t.m.left[i] / b * 100 : 0; });
  const avgRate = mr.length ? Math.round(mr.reduce((a, x) => a + x, 0) / mr.length * 10) / 10 : 0;
  return { st, months:idx.length, partial: idx.length > 0 && idx.length < n, avgRate,
    avg: idx.length ? Math.round(idx.reduce((a, i) => a + t.m.enr[i], 0) / idx.length * 10) / 10 : null,
    newc, left, leftRate: (pre + newc) ? Math.round(left / (pre + newc) * 1000) / 10 : 0,
    smp, reg: newc, regRate: smp ? Math.round(newc / smp * 1000) / 10 : 0 };
}
/* 전체 원을 볼 때 두 원 이상에서 일하는 교사은 한 줄로 합침 (월별 숫자를 같은 달끼리 더함) */
const brLabel = s => (s.branches || [s.branch]).map(b => SHORT[b]).join("·");
function mergeTeachers(rows){
  if (state.branch !== "all") return rows;
  const by = new Map();
  for (const r of rows) (by.get(r.t.name) || by.set(r.t.name, []).get(r.t.name)).push(r);
  return [...by.values()].map(g => {
    if (g.length === 1) return g[0];
    const ref = g.map(x => x.s).sort((a, b) => b.base.localeCompare(a.base))[0].months, pre = prevYm(ref[0]);
    const m = { enr: ref.map(() => 0), new: ref.map(() => 0), left: ref.map(() => 0), smp: ref.map(() => 0), enr0: 0 };
    for (const { t, s } of g){
      ref.forEach((ym, i) => { const j = s.months.indexOf(ym); if (j >= 0) for (const k of ["enr","new","left","smp"]) m[k][i] += t.m[k][j] || 0; });
      const j0 = s.months.indexOf(pre); m.enr0 += j0 >= 0 ? t.m.enr[j0] : s.months[0] === ref[0] ? t.m.enr0 : 0;
    }
    const branches = BRANCH_KEYS.filter(b => g.some(x => x.s.branch === b));
    const ages = {}; for (const { t } of g) for (const [k, v] of Object.entries(t.ages || {})) ages[k] = (ages[k] || 0) + v;
    return { t: { name: g[0].t.name, enrolled: g.reduce((a, x) => a + x.t.enrolled, 0), m, ages }, s: { branch: branches[0], branches, months: ref } };
  });
}
function teacherTableHTML(snaps){
  const rows = snaps.flatMap(s => (s.teachers || []).map(t => ({ t, s })));
  if (!rows.length) return `<p class="empty">반 이름에서 교사를 읽지 못했어요.</p>`;
  if (rows.some(({ t }) => !t.m)) return `<p class="warn-note">기간별로 보려면 원생 명단을 한 번 다시 올려 주세요. (예전에 올린 명단에는 월별 기록이 없어요)</p>`;
  const all = mergeTeachers(rows).map(({ t, s }) => ({ t, s, p: teacherPeriod(t, s) })).sort((a, b) => b.t.enrolled - a.t.enrolled);
  // JP People에서 재직 중인 교사만 보여 줌 (퇴직·휴직·JP People에 없는 이름은 숨김). JP People을 아직 못 불러왔으면 모두 보여 줌
  const known = state.teachers.length > 0;
  const active = known ? all.filter(x => x.p.st && x.p.st.active) : all;
  // 필터: 이름 찾기 · 퇴원율 10% 이상만
  const q = state.tQ.trim();
  const list = active.filter(x => (!q || x.t.name.includes(q)) && (!state.tWarn || (x.p.months > 0 && x.p.leftRate >= 10)));
  // 정렬: 머리글을 누르면 그 칸으로, 다시 누르면 반대로. 숫자가 없는(입사 직후) 교사은 항상 아래
  const SV = { name:x => x.t.name, branch:x => brLabel(x.s), enrolled:x => x.t.enrolled, avg:x => x.p.avg, newc:x => x.p.newc, left:x => x.p.left,
    leftRate:x => x.p.leftRate, avgRate:x => x.p.avgRate, smp:x => x.p.smp, reg:x => x.p.reg, regRate:x => x.p.regRate };
  const { k: sk, dir } = state.tSort, get = SV[sk] || SV.enrolled, textKey = sk === "name" || sk === "branch";
  list.sort((a, b) => {
    const na = a.p.months === 0 && !textKey && sk !== "enrolled", nb = b.p.months === 0 && !textKey && sk !== "enrolled";
    if (na !== nb) return na ? 1 : -1;
    const va = get(a), vb = get(b);
    return (textKey ? String(va).localeCompare(String(vb)) : (va ?? -1) - (vb ?? -1)) * dir || b.t.enrolled - a.t.enrolled;
  });
  const hidden = known ? all.filter(x => !(x.p.st && x.p.st.active)) : [];
  const multi = state.kpiPeriod > 1;
  const tmax = Math.max(1, ...list.map(x => x.t.enrolled));
  const noPeople = list.filter(x => !x.p.st).length;
  if (!active.length) return `<p class="empty">JP People에서 재직 중으로 확인된 교사가 없어요.</p>`;
  const dash = `<span class="mut">–</span>`;
  const th = (k, label, cls = "", tip = "") => { const on = state.tSort.k === k;
    return `<th class="${cls}" aria-sort="${on ? (state.tSort.dir > 0 ? "ascending" : "descending") : "none"}"${tip ? ` data-tip="${esc(tip)}"` : ""}>
      <button type="button" class="sortb${on ? " on" : ""}" data-act="t-sort" data-k="${k}">${label}<i>${on ? (state.tSort.dir > 0 ? "▲" : "▼") : "↕"}</i></button></th>`; };
  const bar = `<div class="tfilter">
      <label class="fsearch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="tQ" placeholder="교사 이름" value="${esc(state.tQ)}" data-fk="tQ" aria-label="교사 이름으로 찾기"></label>
      <label class="tchk"><input type="checkbox" data-act="t-warn" ${state.tWarn ? "checked" : ""}> 퇴원율 10% 이상만</label>
      <span class="tcount">${list.length}명${list.length !== active.length ? ` / ${active.length}명` : ""}</span>
      ${state.tQ || state.tWarn || state.tSort.k !== "enrolled" || state.tSort.dir !== -1 ? `<button type="button" class="linkish" data-act="t-reset">처음대로</button>` : ""}
    </div>`;
  if (!list.length) return bar + `<p class="empty">조건에 맞는 교사가 없어요.</p>`;
  return bar + `<div class="tbl-wrap"><table class="ttable"><thead><tr>${th("name", "교사")}${state.branch === "all" ? th("branch", "원") : ""}
      ${th("enrolled", "현재 재원", "num")}<th class="barc"></th>${th("avg", "평균 재원", "num")}
      ${th("newc", "신규", "num")}${th("left", "퇴원", "num")}${th("leftRate", "퇴원율", "num")}${multi ? th("avgRate", "월평균 퇴원율", "num", "달마다 낸 퇴원율의 평균") : ""}
      ${th("smp", "샘플 수업", "num sep")}${th("reg", "샘플 등록", "num")}${th("regRate", "등록율", "num")}</tr></thead><tbody>
    ${list.map(({ t, s, p }) => {
      const none = p.months === 0;
      const note = !p.st ? `<small class="mut" data-tip="JP People에서 '${esc(t.name)}' 이름을 찾지 못해 입사일을 몰라요. 기간 전체로 계산했어요. JP People의 이름을 반 이름의 교사 이름과 똑같이 맞춰 주세요.">입사일 모름</small>`
        : none ? `<small class="mut">${md(p.st.startYm + "-01").replace(/\.1$/, "월")} 입사, 다음 달부터 계산</small>`
        : p.partial ? `<small class="mut" data-tip="입사한 달은 빼고 계산해요">${p.months}개월치</small>` : "";
      return `<tr><td><b>${esc(t.name)}</b>${note}</td>${state.branch === "all" ? `<td>${esc(brLabel(s))}</td>` : ""}
        <td class="num">${t.enrolled}</td><td class="barc"><span class="tb-bar"><i style="width:${t.enrolled / tmax * 100}%"></i></span></td>
        <td class="num">${none ? dash : p.avg}</td>
        <td class="num">${none ? dash : p.newc}</td><td class="num">${none ? dash : p.left}</td>
        <td class="num ${!none && p.leftRate >= 10 ? "warn" : ""}">${none ? dash : p.leftRate + "%"}</td>
        ${multi ? `<td class="num ${!none && p.avgRate >= 5 ? "warn" : ""}">${none ? dash : p.avgRate + "%"}</td>` : ""}
        <td class="num sep">${none ? dash : p.smp}</td><td class="num">${none ? dash : p.reg}</td><td class="num">${none ? dash : p.regRate + "%"}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="fnote">평균 재원 = 기간 동안 매달 말 재원생의 평균(이번 달은 지금 기준). 퇴원율 = 퇴원 ÷ (기간 시작 재원 + 신규).
      ${multi ? "월평균 퇴원율 = 달마다 (퇴원 ÷ 전달 말 재원 + 그 달 신규)의 평균. " : ""}샘플 수업 = 샘플 후 아직 등록 안 한 원생 + 신규 등록, 등록율 = 신규 ÷ 샘플 수업. 입사한 달은 빼고 다음 달부터 계산해요${noPeople ? ` (입사일 모름 ${noPeople}명은 기간 전체)` : ""}.
      ${state.branch === "all" && list.some(x => x.s.branches) ? "두 원 이상에서 일하는 교사는 원별 숫자를 합쳐 한 줄로 보여요. " : ""}
      ${hidden.length ? `<br>JP People에서 재직 중이 아니라 숨긴 이름 ${hidden.length}명: ${esc([...new Set(hidden.map(x => x.t.name))].join(", "))}` : ""}</p>`;
}

/* ── 신규 · 퇴원 · 순증: 12개월 합계를 작년과 비교한 숫자 + 막대 겹치기(연한 넓은 막대 = 작년, 진한 좁은 막대 = 올해) ── */
function overlayBars({ labels, cur, ly, color, colorNeg, aria }){
  const W = 360, H = 130, L = 30, R = 6, T = 8, B = 20, iw = W - L - R, ih = H - T - B, n = labels.length, slot = iw / n;
  const vals = [...cur, ...(ly || [])].filter(v => v != null);
  const mn = Math.min(0, ...vals), mx = Math.max(1, ...vals), ticks = niceTicks(mn, mx), y0 = ticks[0], y1 = ticks.at(-1);
  const y = v => T + ih * (1 - (v - y0) / (y1 - y0)), base = y(0);
  const gid = "ob" + Math.random().toString(36).slice(2, 7);
  const grad = (id, c) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".55"/></linearGradient>`;
  const rect = (cx, w, v, fill, op = 1) => { const a = y(Math.max(v, 0)), b = y(Math.min(v, 0)); return `<rect x="${cx - w / 2}" y="${a}" width="${w}" height="${Math.max(1, b - a)}" rx="${Math.min(3, w / 3)}" fill="${fill}" opacity="${op}"/>`; };
  return `<svg class="chart ob" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria || "")}">
    <defs>${grad(gid + "p", color)}${colorNeg ? grad(gid + "n", colorNeg) : ""}</defs>
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? "#D6D6D6" : "#EEEEEE"}"/><text x="${L - 5}" y="${y(t) + 3}" text-anchor="end" class="ax">${t}</text>`).join("")}
    ${labels.map((l, i) => { const cx = L + slot * i + slot / 2, v = cur[i], p = ly?.[i], neg = colorNeg && v < 0;
      return `${p != null ? rect(cx, Math.min(16, slot * .78), p, colorNeg && p < 0 ? colorNeg : color, .18) : ""}
        ${rect(cx, Math.min(8, slot * .4), v, `url(#${gid}${neg ? "n" : "p"})`)}
        ${i % 2 === 0 || n <= 6 ? `<text x="${cx}" y="${H - 5}" text-anchor="middle" class="ax">${esc(l)}</text>` : ""}
        <rect class="hit band" x="${L + slot * i}" y="${T}" width="${slot}" height="${ih}" fill="transparent"
          data-tip="${esc(`${l}\n올해 ${v > 0 && colorNeg ? "+" : ""}${v}명${p != null ? `\n작년 ${p > 0 && colorNeg ? "+" : ""}${p}명` : ""}`)}"/>`; }).join("")}
  </svg>`;
}
function nlTilesHTML(labels, nlSeries, hasLY){
  const [N, Lv] = nlSeries, sum = a => (a || []).reduce((x, v) => x + (v || 0), 0);
  const net = N.values.map((v, i) => v - Lv.values[i]), netLY = hasLY ? N.ly.map((v, i) => v - Lv.ly[i]) : null;
  const sign = v => (v > 0 ? "+" : "") + v;
  const cmp = (cur, prev, goodUp, isNet) => {
    if (prev == null) return `<div class="nl-c mut">작년 숫자 없음 (명단을 다시 올리면 나와요)</div>`;
    const d = cur - prev, good = goodUp ? d >= 0 : d <= 0;
    const pct = !isNet && prev ? ` (${sign(Math.round(d / prev * 100))}%)` : "";
    return `<div class="nl-c ${d === 0 ? "mut" : good ? "good" : "bad"}">작년 ${isNet ? sign(prev) : prev}명보다 ${sign(d)}명${pct}</div>`;
  };
  const tile = (title, cur, prev, goodUp, chart, isNet) => `<div class="nl-t">
      <div class="nl-l">${title}</div><div class="nl-v">${isNet ? sign(cur) : cur}<small>명</small></div>${cmp(cur, prev, goodUp, isNet)}${chart}</div>`;
  return `<div class="nl-tiles">
      ${tile("신규", sum(N.values), hasLY ? sum(N.ly) : null, true, overlayBars({ labels, cur:N.values, ly:N.ly, color:"#8B5CF6", aria:"월별 신규" }))}
      ${tile("퇴원", sum(Lv.values), hasLY ? sum(Lv.ly) : null, false, overlayBars({ labels, cur:Lv.values, ly:Lv.ly, color:"#D1495B", aria:"월별 퇴원" }))}
      ${tile("순증 (신규 − 퇴원)", sum(net), hasLY ? sum(netLY) : null, true, overlayBars({ labels, cur:net, ly:netLY, color:"#1F7A4D", colorNeg:"#D1495B", aria:"월별 순증" }), true)}
    </div>
    <div class="legend"><span><i class="box" style="background:#767676"></i>진한 좁은 막대 = 올해</span>${hasLY ? `<span><i class="box" style="background:#767676;opacity:.25"></i>연한 넓은 막대 = 작년 같은 달</span>` : ""}<span>막대에 마우스를 올리면 숫자가 나와요</span></div>`;
}

/* ── 연령별 현황: 전체 분포 막대 + 교사 × 나이 표(칸 색이 진할수록 많음) ── */
function ageHTML(snaps){
  if (!snaps.some(s => s.ages)) return `<p class="warn-note">원생 명단을 다시 올리면 연령별 현황이 나와요.</p>`;
  const tot = {}; snaps.forEach(s => Object.entries(s.ages || {}).forEach(([k, v]) => tot[k] = (tot[k] || 0) + v));
  const sumAll = AGE_KEYS.reduce((a, k) => a + (tot[k] || 0), 0), unknown = snaps.reduce((a, s) => a + (s.agesUnknown || 0), 0);
  if (!sumAll) return `<p class="empty">명단에서 나이를 읽지 못했어요. 자라다 시스템 엑셀에 '나이' 열이 있는지 확인해 주세요.</p>`;
  const mx = Math.max(1, ...AGE_KEYS.map(k => tot[k] || 0));
  const dist = `<div class="age-dist">${AGE_KEYS.map(k => { const v = tot[k] || 0, pc = Math.round(v / sumAll * 1000) / 10;
      return `<div class="ad-row" data-tip="${esc(`${ageLabel(k)}\n${v}명, 전체의 ${pc}%`)}"><span class="ad-k">${ageLabel(k)}</span>
        <span class="ad-bar"><i style="width:${v / mx * 100}%"></i></span><span class="ad-v">${v}<small>${pc}%</small></span></div>`; }).join("")}
      <p class="fnote">순수 재원생 ${sumAll}명 기준${unknown ? `, 나이 없는 ${unknown}명 제외` : ""}. 평균 ${(AGE_KEYS.reduce((a, k) => a + (+k) * (tot[k] || 0), 0) / sumAll).toFixed(1)}세(5세 이하·13세 이상은 5·13으로 계산)</p></div>`;
  // 교사 × 나이 (재직 중인 교사만, 여러 원이면 합산)
  const rows = mergeTeachers(snaps.flatMap(s => (s.teachers || []).map(t => ({ t, s }))))
    .filter(({ t, s }) => { if (!state.teachers.length) return true; const st = teacherStart(t.name, s.branch); return st && st.active; })
    .filter(({ t }) => t.ages && Object.keys(t.ages).length).sort((a, b) => b.t.enrolled - a.t.enrolled);
  const cmax = Math.max(1, ...rows.flatMap(({ t }) => AGE_KEYS.map(k => t.ages[k] || 0)));
  const cell = (v, strong) => { const a = v / cmax; return `<td class="num hc2" style="background:${v ? indigoOf(Math.min(1, a)) : "transparent"};color:${a > .55 ? "#fff" : v ? "var(--ink)" : "#C4C4C4"}${a > .55 || strong ? ";font-weight:700" : ""}">${v || "·"}</td>`; };
  const colSum = k => rows.reduce((a, { t }) => a + (t.ages[k] || 0), 0);
  const table = rows.length ? `<div class="tbl-wrap"><table class="ttable agetbl"><thead><tr><th>교사</th>${state.branch === "all" ? "<th>원</th>" : ""}${AGE_KEYS.map(k => `<th class="num">${k === "5" ? "~5세" : k === "13" ? "13세~" : k + "세"}</th>`).join("")}<th class="num sep">합계</th></tr></thead><tbody>
      ${rows.map(({ t, s }) => { const tsum = AGE_KEYS.reduce((a, k) => a + (t.ages[k] || 0), 0);
        return `<tr><td><b>${esc(t.name)}</b></td>${state.branch === "all" ? `<td>${esc(brLabel(s))}</td>` : ""}${AGE_KEYS.map(k => cell(t.ages[k] || 0)).join("")}<td class="num sep"><b>${tsum}</b></td></tr>`; }).join("")}
      <tr class="sumr"><td><b>합계</b></td>${state.branch === "all" ? "<td></td>" : ""}${AGE_KEYS.map(k => `<td class="num"><b>${colSum(k)}</b></td>`).join("")}<td class="num sep"><b>${AGE_KEYS.reduce((a, k) => a + colSum(k), 0)}</b></td></tr>
      <tr class="sumr"><td>교사 평균</td>${state.branch === "all" ? "<td></td>" : ""}${AGE_KEYS.map(k => `<td class="num">${(colSum(k) / rows.length).toFixed(1)}</td>`).join("")}<td class="num sep">${(AGE_KEYS.reduce((a, k) => a + colSum(k), 0) / rows.length).toFixed(1)}</td></tr>
    </tbody></table></div><p class="fnote">숫자는 원생 수예요. 칸 색이 진할수록 많아요. 표 합계는 재직 중인 교사 반만 더한 값이에요.</p>` : `<p class="empty">교사별 나이 정보가 없어요.</p>`;
  return `<div class="age-wrap">${dist}<div>${table}</div></div>${ageLeaveHTML(snaps)}`;
}
/* 연령별 퇴원율: 기간 동안 그 나이 원생(기간 시작 재원 + 기간 신규) 중 퇴원한 비율 */
function ageLeaveHTML(snaps){
  if (!snaps.every(s => s.ageM)) return `<p class="warn-note" style="margin-top:16px">원생 명단을 다시 올리면 연령별 퇴원율이 나와요.</p>`;
  const n = state.ageP, first = 12 - n;
  const rows = AGE_KEYS.map(k => { let base = 0, newc = 0, left = 0;
    for (const s of snaps){ const m = s.ageM[k]; if (!m) continue;
      base += first === 0 ? m.enr0 : m.enr[first - 1];
      for (let i = first; i < 12; i++){ newc += m.new[i] || 0; left += m.left[i] || 0; } }
    const tot = base + newc; return { k, tot, left, rate: tot ? Math.round(left / tot * 1000) / 10 : 0 }; });
  const all = rows.reduce((a, r) => ({ tot: a.tot + r.tot, left: a.left + r.left }), { tot:0, left:0 }), avg = all.tot ? Math.round(all.left / all.tot * 1000) / 10 : 0;
  const mx = Math.max(1, ...rows.map(r => r.rate));
  return `<div class="age-leave"><div class="al-h"><h3>연령별 퇴원율 <span class="sub">${esc(n === 1 ? "이번 달" : n === 12 ? "최근 1년" : `최근 ${n}개월`)}, 전체 평균 ${avg}%</span></h3>
      <div class="seg2 sm" role="group" aria-label="연령별 퇴원율 기간">${KPI_PERIODS.map(([p, l]) => `<button type="button" data-act="age-period" data-n="${p}" aria-pressed="${n === p}">${l}</button>`).join("")}</div></div>
    <div class="al-list">${rows.map(r => `<div class="al-row" data-tip="${esc(`${ageLabel(r.k)}\n기간 동안 다닌 원생 ${r.tot}명 중 ${r.left}명 퇴원 (${r.rate}%)`)}">
        <span class="al-k">${ageLabel(r.k)}</span>
        <span class="al-bar"><i style="width:${r.rate / mx * 100}%;background:${r.rate > avg ? "#D1495B" : "#F0A3AD"}"></i><em style="left:${avg / mx * 100}%"></em></span>
        <span class="al-v"><b>${r.rate}%</b><small>${r.left} / ${r.tot}명</small></span></div>`).join("")}</div>
    <p class="fnote">퇴원율 = 기간 동안 퇴원한 원생 ÷ (기간 시작 때 재원 + 기간 중 신규). 진한 빨강 = 전체 평균보다 높음, 세로선 = 전체 평균. 나이는 자라다 시스템 '나이' 열(지금 기준).</p></div>`;
}

/* ── 샘플 퍼널 (세로): 문의 → 샘플 진행 → 샘플 후 등록 → 정규 등록. 원이 여럿이면 원별로 나란히 ── */
const FUNNEL = [["inq","문의"],["sample","샘플 진행"],["reg","샘플 후 등록"],["regular","정규 등록"]];
// 보라 단계(신규 색 계열): 옅은 → 진한. 빠진 인원은 회색 빗금
const FUNNEL_C = ["#E4D9FB","#C3AEF7","#9F7DF0","#6D3FD8"];
function funnelHTML(snaps){
  const cols = snaps.map(s => ({ s, f: s.cur.funnel }));
  if (cols.some(c => !c.f)) return `<p class="warn-note">원생 명단을 다시 올리면 단계별 퍼널이 나와요.</p>`;
  const top = Math.max(1, ...cols.map(c => c.f.inq));   // 세 원 공통 기준(가장 많은 문의)이라 원끼리 막대 길이를 비교할 수 있음
  return `<div class="hfun-wrap" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map(({ s, f }) => `<div class="hfun">
      ${cols.length > 1 ? `<div class="hf-b">${esc(BRANCHES[s.branch])}</div>` : ""}
      ${FUNNEL.map(([k, l], i) => { const v = f[k] || 0, prev = i ? f[FUNNEL[i - 1][0]] || 0 : null, lost = prev != null ? Math.max(0, prev - v) : 0;
        const conv = prev != null ? (prev ? Math.round(v / prev * 100) : 0) : null;
        return `<div class="hf-row" data-tip="${esc(`${BRANCHES[s.branch]} · ${l}\n${v}명${conv != null ? `\n앞 단계에서 ${lost}명 빠짐 (전환 ${conv}%)` : ""}`)}">
            <span class="hf-l">${l}</span><span class="hf-bar"><i style="width:${v / top * 100}%;background:${FUNNEL_C[i]}"></i>${lost ? `<u style="width:${lost / top * 100}%"></u>` : ""}</span><b>${v}</b></div>
          ${conv != null ? `<div class="hf-lost">${lost ? `−${lost}명 빠짐 · ` : ""}전환 ${conv}%</div>` : `<div class="hf-gap"></div>`}`; }).join("")}
      <div class="vf-tot">문의 → 정규 등록 <b>${f.inq ? Math.round(f.regular / f.inq * 100) : 0}%</b></div></div>`).join("")}</div>
    <p class="fnote">막대 길이는 ${cols.length > 1 ? "세 원 공통 기준(가장 많은 문의)이에요. " : ""}회색 빗금 = 앞 단계에서 빠진 인원. 이번 달에 등록일이 있는 원생 기준. 샘플 진행 = '대기' 상태 제외, 샘플 후 등록 = 등록한 원생, 정규 등록 = 그중 지금 수업을 다니는 원생.</p>`;
}

/* ── 지금 확인이 필요한 것 (공지 · 캘린더 화면에 표시): 원생 명단에서 뽑은 확인 대상 ── */
function checkListHTML(){

  const L = k => snaps.flatMap(s => (s.lists?.[k] || []).map((x, i) => ({ ...x, branch:s.branch, amt: k === "unpaid" ? privAmts(s.branch)[i] || 0 : 0 })));
  const lists = [

  return lists.map(([s, title, items, line]) => `<details class="chk-d ${s}"><summary>${ICON[s]}<span class="t">${title}</span><b>${items.length}명</b></summary>
      ${items.length ? `<ul>${items.slice(0, 60).map(x => `<li>${state.branch === "all" ? `<span class="tagb">${SHORT[x.branch]}</span>` : ""}${esc(line(x))}</li>`).join("")}</ul>
        ${items.length > 60 ? `<p class="empty">외 ${items.length - 60}명</p>` : ""}` : `<p class="empty">해당하는 원생이 없어요.</p>`}
      ${branchOptions("todos").length && items.length ? `<button type="button" class="icon-btn" data-act="todo-new" data-title="${esc(title)} ${items.length}명 확인">할 일로 만들기</button>` : ""}</details>`).join("")
    + `<p class="fnote">${esc(snaps.map(s => `${SHORT[s.branch]} ${md(s.base)}`).join(", "))} 올린 원생 명단 기준이에요.</p>`;

/* 요일·시간대 표 색: 옅은 청록 #E0F2EE → 진한 청록 #0B5F57 (t = 0~1) */
const tealOf = t => { const A = [0xE0,0xF2,0xEE], B = [0x0B,0x5F,0x57]; return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * Math.max(0, Math.min(1, t)))).join(",")})`; };
/* 연령별 표 색: 옅은 인디고 #E6E8FB → 인디고 블루 #3240B8 */
const indigoOf = t => { const A = [0xE6,0xE8,0xFB], B = [0x32,0x40,0xB8]; return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * Math.max(0, Math.min(1, t)))).join(",")})`; };
function kpiPageHTML(){
  const bs = visBranches(), snaps = bs.map(b => state.kpi[b]).filter(Boolean), canUp = branchOptions("kpi").some(b => b !== "all");
  const metaLine = bs.map(b => state.kpi[b] ? `${BRANCHES[b]} ${md(state.kpi[b].base)} 기준` : `${BRANCHES[b]} 명단 없음`).join(", ");
  const head = `<div class="head"><h1>운영지표</h1>
    <div class="acts">${canUp ? `<button type="button" class="btn btn-primary btn-sm" data-act="lms-pick" data-tip="${state.branch === "all" && branchOptions("kpi").filter(b => b !== "all").length > 1 ? "3개 원 명단을 한 번에 골라도 돼요 (Ctrl 또는 Shift를 누른 채 여러 파일 선택)" : "자라다 시스템에서 내려받은 원생 목록 엑셀"}">원생 명단 올리기${state.branch === "all" && branchOptions("kpi").filter(b => b !== "all").length > 1 ? " (여러 원 한 번에)" : ""}</button>` : ""}</div></div>
    <p class="kpi-meta left">${esc(metaLine)}. 화살표는 전월 대비 <button type="button" class="linkish" data-act="kpi-help">계산 기준</button></p>`;
  if (!snaps.length) return head + `<div class="soon"><h2>아직 올린 원생 명단이 없어요</h2>
      <p>자라다 시스템에서 원생 목록을 엑셀로 내려받아 '원생 명단 올리기'로 올리면 재원·신규·퇴원·샘플·미납·교사별 지표가 계산돼요.</p>
      <p>매주 한 번 올리는 것을 권해요. 지난 달 추이는 명단의 등록일과 종료일로 자동 계산돼요.</p></div>` + (state.isAdmin ? adminRowsHTML(bs) : "");
  const partial = snaps.length < bs.length;
  /* 지표 칸 */
  const tile = m => {
    if (state.branch !== "all"){
      const s = state.kpi[state.branch], cur = s.cur[m.key], prev = s.prev[m.key];
      const sub = m.sub ? `<div class="sub-row"><span class="sl">${m.sub.label}</span><span class="sv">${fmt(m.sub, s.cur[m.sub.key])}${m.sub.unit}</span>
        <div class="d">${delta(m.sub, s.cur[m.sub.key], s.prev[m.sub.key])}</div></div>` : "";
      const extra = m.key === "unpaid" && state.isAdmin && privAmt(state.branch) ? `<div class="d"><span>${won(privAmt(state.branch))}</span></div>` : "";
      return `<div class="kpi"><div class="l">${m.label}${m.mainLabel ? `<span class="ml">${m.mainLabel}</span>` : ""}</div>
        <div class="v">${fmt(m, cur)}<small>${m.unit}</small></div><div class="d">${prev == null ? "<span>이번 명단 기준</span>" : delta(m, cur, prev)}</div>${extra}${sub}</div>`;
    }
    return `<div class="kpi multi"><div class="l">${m.label}${m.sub ? `<span class="ml">${m.mainLabel ? m.mainLabel + " / " : ""}${m.sub.label}</span>` : ""}</div>${BRANCH_KEYS.map(b => {
      const s = state.kpi[b]; if (!s) return `<div class="br"><div class="bv"><span class="bn">${SHORT[b]}</span><span class="n na">-</span></div></div>`;
      const cur = s.cur[m.key], prev = s.prev[m.key];
      return `<div class="br"><div class="bv"><span class="bn">${SHORT[b]}</span><span class="n">${fmt(m, cur)}<small>${m.unit}</small>${m.sub ? `<em>${fmt(m.sub, s.cur[m.sub.key])}${m.sub.unit}</em>` : ""}</span></div>
        <div class="d">${prev == null ? "" : deltaShort(m, cur, prev)}${m.sub ? deltaShort(m.sub, s.cur[m.sub.key], s.prev[m.sub.key]) : ""}</div></div>`; }).join("")}</div>`;
  };
  /* 추이 차트 */
  const ref = snaps[0], labels = ref.months.map(mLabel);
  const enrSeries = [...snaps.filter(s => s.enrolledLY).map(s => ({ name:`${BRANCHES[s.branch]} 작년`, color:BRANCH_COLOR[s.branch], values:s.enrolledLY.map(v => v || null), dash:true })),
    ...snaps.map(s => ({ name:BRANCHES[s.branch], color:BRANCH_COLOR[s.branch], values:s.enrolled }))];
  const sum = k => ref.months.map((_, i) => snaps.reduce((t, s) => t + (s[k][i] || 0), 0));
  const restNote = snaps.filter(s => s.cur.rest > 0).map(s => `${BRANCHES[s.branch]} ${s.cur.rest}명`).join(", ");
  const hasLY = snaps.every(s => s.newcLY);
  const nlSeries = [{ name:"신규", color:"var(--c-new)", values:sum("newc"), ly: hasLY ? sum("newcLY") : null },
                    { name:"퇴원", color:"var(--c-left)", values:sum("left"), ly: hasLY ? sum("leftLY") : null }];
  /* 샘플 → 등록 */
  const funnel = funnelHTML(snaps);
  /* 요일 × 시간 재원 */
  const heat = {}; snaps.forEach(s => Object.entries(s.heat || {}).forEach(([d, hrs]) => Object.entries(hrs).forEach(([h, n]) => { (heat[d] ||= {}); heat[d][h] = (heat[d][h] || 0) + n; })));
  const days = ["월","화","수","목","금","토","일"].filter(d => heat[d]), hours = [...new Set(days.flatMap(d => Object.keys(heat[d]).map(Number)))].sort((a,b) => a - b);
  const hmax = Math.max(1, ...days.flatMap(d => Object.values(heat[d])));
  /* 열 = 요일, 행 = 시간대 */
  const heatHTML = days.length ? `<div class="heat" style="grid-template-columns:40px repeat(${days.length},minmax(0,1fr))">
      <span></span>${days.map(d => `<span class="hh">${d}</span>`).join("")}
      ${hours.map(h => `<span class="hd">${h}시</span>${days.map(d => { const n = heat[d][h] || 0, a = n / hmax;
        return `<span class="hc" style="background:${n ? tealOf(a) : "#F4F4F4"};color:${a > .5 ? "#fff" : "var(--ink)"}" data-tip="${esc(`${d}요일 ${h}시\n재원 ${n}명`)}">${n || ""}</span>`; }).join("")}`).join("")}
    </div><div class="heat-scale"><span>적음</span><i></i><span>많음</span></div>` : `<p class="empty">반 이름에서 요일·시간을 읽지 못했어요.</p>`;
  /* 교사별 (기간 선택) */
  const teacherHTML = teacherTableHTML(snaps);
  return head + `
  ${partial ? `<p class="warn-note">명단이 없는 원은 빈칸으로 보여요. 그 원에서 명단을 올리면 채워져요.</p>` : ""}
  <div class="kpis kpis7">${KPI_TILES.map(tile).join("")}</div>
  <section class="card"><h2>신규와 퇴원 <span class="sub">최근 12개월${snaps.length > 1 ? ", 원 합계" : ""}${hasLY ? ", 작년 같은 기간과 비교" : ""}</span></h2>
    ${nlTilesHTML(labels, nlSeries, hasLY)}</section>
  <section class="card"><h2>샘플에서 등록까지 <span class="sub">이번 달</span></h2>${funnel}</section>
  <div class="grid2 even">
    <section class="card"><h2>재원생 추이 <span class="sub">최근 12개월, 월말 기준</span></h2>
      ${lineChart({ labels: restNote ? labels.map((l, i) => i === labels.length - 1 ? l + "*" : l) : labels, series:enrSeries, fmtV:v => v + "명", fixMin:100, fixMax:400, h:330, aria:"재원생 추이" })}${enrSeries.length > 1 ? legend(enrSeries) : ""}
      ${restNote ? `<p class="fnote">* ${esc(labels.at(-1))}(이번 명단)부터 휴원생 제외: ${esc(restNote)}. 지난 달들은 당시 휴원 여부를 알 수 없어 포함돼 있어요.</p>` : ""}</section>
    <section class="card"><h2>요일 · 시간대별 재원생 <span class="sub">${snaps.length > 1 ? "원 합계, " : ""}반 이름 기준</span></h2>${heatHTML}</section>
  </div>
  <section class="card tcard"><div class="card-h"><h2>교사별 운영지표 <span class="sub">${esc(periodLabel())}</span></h2>
      ${state.isAdmin ? `<button type="button" class="icon-btn" data-act="people-resync" data-tip="JP People에서 입사일을 고쳤다면 눌러서 다시 맞춰요">JP People 다시 불러오기</button>` : ""}
      <div class="seg2 sm" role="group" aria-label="기간">${KPI_PERIODS.map(([n, l]) => `<button type="button" data-act="kpi-period" data-n="${n}" aria-pressed="${state.kpiPeriod === n}">${l}</button>`).join("")}</div></div>
    ${teacherHTML}</section>
  <section class="card tcard">${counselHTML()}</section>
  <section class="card"><h2>연령별 현황 <span class="sub">지금 재원생, ${snaps.length > 1 ? "원 합계, " : ""}자라다 시스템 '나이' 기준</span></h2>${ageHTML(snaps)}</section>

  ${state.isAdmin ? adminRowsHTML(bs) : ""}`;
}

/* 대표 전용: 매출 · HR */
function extBox(key, inner){
  const e = ext[key];
  if (e.status === "ok") return inner(e.data);
  if (e.status === "loading") return `<p class="empty">${EXT[key].name}에서 불러오는 중이에요…</p>`;
  return `<div class="connect"><p>${e.status === "error" ? esc(e.msg) : `${EXT[key].name}에 대표 Google 계정으로 한 번 로그인하면 바로 보여요. 다음부터는 자동으로 연결돼요.`}</p>
    <button type="button" class="btn btn-ghost btn-sm" data-act="ext-connect" data-key="${key}">${EXT[key].name} 연결</button></div>`;
}
/* 매출 차트 한 원: 올해(색 면 + 선) · 작년(점선) · 재작년(점점선). big=원 하나 골랐을 때 크게 */
function revChart(r, labels, big){
  const w = big ? 1100 : 380, h = big ? 260 : 180, P = { l:42, r:14, t:14, b:24 };
  const all = [...r.cur, ...r.ly, ...r.ly2].filter(v => v != null && v > 0);
  if (!all.length) return `<p class="empty">매출 자료가 없어요.</p>`;
  const ticks = niceTicks(Math.min(...all) * .92, Math.max(...all) * 1.04), y0 = ticks[0], y1 = ticks.at(-1);
  const x = i => P.l + (w - P.l - P.r) * i / (labels.length - 1), y = v => P.t + (h - P.t - P.b) * (1 - (v - y0) / (y1 - y0));

      ...DEMO_MEMBERS.map(m => [m.email, `${m.name} (${memBranchLabel(m.branches)})`])]
    .map(([e,l]) => `<option value="${e}">${l}</option>`).join("");
  demoAs.value = store.get("portal.demoAs") || ADMIN_EMAILS[0];
  demoAs.addEventListener("change", () => { store.set("portal.demoAs", demoAs.value); store.del("portal.writer"); enter({ email: demoAs.value }); toast(`${demoAs.selectedOptions[0].text}(으)로 보고 있어요.`); });
  $("demoReset").addEventListener("click", async () => { if (await confirmBox("미리보기에서 바꾼 내용을 지우고 샘플로 되돌릴까요?", "되돌리기")) { DB.resetDemo(); toast("샘플로 되돌렸어요."); } });
  enter({ email: demoAs.value });
}

</script>
</body>
</html>
